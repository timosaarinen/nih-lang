<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NIH gfx runtime</title>
  <style>html,body,canvas{margin:0;width:100%;height:100%;display:block;background:#000}</style>
</head>
<body>
<script type="module">
  import { gfxOpen, gfxFrame, gfxRun, clear } from './gfx.mjs'
  const gfx = await gfxOpen()
  gfxFrame(gfx, (frame, commands) => {
    const p = 0.5 + 0.5 * Math.sin(frame.time)
    commands.push(clear([p * 0.15, 0.02, 0.12 + p * 0.25, 1]))
  })
  gfxRun(gfx)
</script>
</body>
</html>
